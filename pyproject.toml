[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-intelligence-platform"
version = "0.1.0"
description = "Premier League data feasibility probe and platform architecture"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit==1.65.0", "plotly==6.9.0", "pandas==2.3.3", "tzdata>=2025.1"]

[project.scripts]
football-probe = "football_intelligence.probe:main"
football-data-probe = "football_intelligence.football_data:main"

[tool.setuptools.packages.find]
where = ["src"]

